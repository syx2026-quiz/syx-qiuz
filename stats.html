<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>答题情况仪表盘</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:"PingFang SC","Microsoft YaHei",sans-serif;
    background:#FFF6EC; color:#222;
    display:flex; justify-content:center;
    min-height:100vh;
  }
  #app { width:100%; max-width:560px; padding:24px 18px 60px; }
  h1 { font-size:24px; font-weight:800; text-align:center; margin-bottom:6px; }
  .tip { text-align:center; font-size:12px; color:#999; margin-bottom:20px; }

  .sketch-card {
    background:#fff; border:3px solid #222;
    border-radius:16px; box-shadow:4px 4px 0 #222;
  }

  /* 口令门 */
  #gate {
    max-width:340px; margin:80px auto 0; padding:28px 22px; text-align:center;
  }
  #gate input {
    width:100%; padding:12px 14px; font-size:16px; margin:14px 0;
    border:3px solid #222; border-radius:12px; outline:none; text-align:center;
  }
  #gate button {
    width:100%; padding:12px; background:#FF5D73; color:#fff;
    border:3px solid #222; border-radius:14px; box-shadow:4px 4px 0 #222;
    font-size:16px; font-weight:700; cursor:pointer;
  }
  #gate .err { color:#e33; font-size:13px; min-height:18px; }

  /* 总览 */
  .summary { display:flex; gap:10px; margin-bottom:24px; }
  .sum-card { flex:1; text-align:center; padding:14px 6px; }
  .sum-num { font-size:26px; font-weight:900; color:#FF5D73; }
  .sum-label { font-size:12px; color:#888; margin-top:2px; }

  .section-title { font-size:17px; font-weight:800; margin:26px 0 12px; }

  /* 每题答对率 */
  .qstat { padding:10px 14px; margin-bottom:8px; }
  .qstat-row { display:flex; justify-content:space-between; font-size:13px; margin-bottom:6px; }
  .qstat-q { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600; }
  .qstat-pct { font-weight:800; color:#FF5D73; margin-left:8px; flex-shrink:0; }
  .bar-track { height:10px; background:#eee; border:2px solid #222; border-radius:6px; overflow:hidden; }
  .bar-fill { height:100%; background:#7DDB8A; }

  /* 玩家详情 */
  .player { margin-bottom:12px; }
  .player summary {
    list-style:none; cursor:pointer;
    display:flex; align-items:center; gap:10px; padding:12px 14px;
  }
  .player summary::-webkit-details-marker { display:none; }
  .p-name { font-weight:800; flex:1; }
  .p-score { font-weight:800; color:#FF5D73; }
  .p-time { font-size:11px; color:#999; flex-shrink:0; }
  .p-arrow { color:#999; font-size:13px; }
  .player[open] .p-arrow { transform:rotate(90deg); }
  .detail-list { border-top:2px dashed #ccc; padding:10px 14px 14px; }
  .d-row { display:flex; align-items:flex-start; gap:8px; font-size:13px; padding:7px 0; border-bottom:1px dashed #eee; }
  .d-row:last-child { border-bottom:none; }
  .d-ok { color:#2a9d4a; font-weight:800; flex-shrink:0; }
  .d-bad { color:#e04646; font-weight:800; flex-shrink:0; }
  .d-main { flex:1; line-height:1.45; }
  .d-sub { color:#999; font-size:12px; }
  .empty { text-align:center; color:#999; font-size:14px; padding:30px 0; }
  .load-err { text-align:center; color:#e33; font-size:14px; padding:30px 0; }
</style>
</head>
<body>
<div id="app">
  <div id="gate" class="sketch-card">
    <div style="font-weight:800;font-size:17px;">🔒 仪 表 盘</div>
    <div style="font-size:12px;color:#888;margin-top:6px;">仅 syx 本人使用，请输入口令</div>
    <input id="gate-input" type="password" placeholder="口令">
    <div class="err" id="gate-err"></div>
    <button id="gate-btn">进入</button>
  </div>

  <div id="main" style="display:none;">
    <h1>📊 答题情况仪表盘</h1>
    <div class="tip">数据来自 Supabase · 每次重新答题会覆盖同设备旧记录</div>

    <div class="summary" id="summary"></div>

    <div class="section-title">每道题的答对率（低的排前面 👀）</div>
    <div id="qstats"></div>

    <div class="section-title">玩家作答明细（点开展开）</div>
    <div id="players"><div class="empty">加载中…</div></div>
  </div>
</div>

<script>
/* 口令 */
const GATE_CODE = "tongren";

/* ================= Supabase ================= */
const SUPA = {
  url: "https://zxufidaltblkzhrobuwt.supabase.co",
  anonKey: "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Inp4dWZpZGFsdGJsa3pocm9idXd0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTQ1Njg4MjYsImV4cCI6MjExMDE0NDgyNn0.bxEJiDSLfwU5OoWHBGNUbik-QMf6WP8ySlXBdI7N8as"
};
function supaHeaders(){
  return { "apikey": SUPA.anonKey, "Authorization": "Bearer " + SUPA.anonKey };
}
function supaUrl(path){ return SUPA.url.replace(/\/$/,"") + "/rest/v1" + path; }

/* ================= 题库（与答题页一致，正确答案均为 o[0]） ================= */
const BANK = [
  { q:"syx平时用哪个软件看同人最多？",     o:["Lofter","微博","ao3","小红书"] },
  { q:"syx磕过的cp大部分是？",             o:["bg","bl","gl","gb"] },
  { q:"syx最喜欢的动画是？",               o:["进击的巨人","eva新世纪福音战士","钢之炼金术师FA","宝石之国"] },
  { q:"syx在《银魂》中磕哪一对？",         o:["冲神","银神","双神","银土"] },
  { q:"syx的本命cp是？",                   o:["林塞","米英","冲神","薰嗣"] },
  { q:"syx最喜欢的漫画是？",               o:["迷宫饭","跃动青春","死亡笔记","地缚少年花子君"] },
  { q:"syx人生中扎的第一个痛包是哪对cp？", o:["米英","林塞","冲神","辛芙"] },
  { q:"syx目前去过的第一个漫展是？",       o:["截至今日还没去过漫展","bilibiliworld","某ip的only展","comicup"] },
  { q:"syx在《进击的巨人》里最喜欢的角色是？", o:["韩吉","艾伦","阿尔敏","利威尔"] },
  { q:"syx最喜欢的动漫ost是？",            o:["《进击的巨人》恶魔之子","《家有女友》声嘶力竭","《eva》one last kiss","《紫罗兰永恒花园》Sincerely"] },
  { q:"syx对于女角色发色的偏好是？",       o:["白毛","粉毛","黑毛","黄毛"] },
  { q:"syx初中时最喜欢的动漫角色是？",     o:["《魔女之旅》伊蕾娜","《Re0》艾米莉亚","《鬼灭之刃》蝴蝶忍","《孤独摇滚》伊地知虹夏"] },
  { q:"syx看过的第一部国漫是？",           o:["《刺客伍六七》","《狐妖小红娘》","《时光代理人》","《罗小黑战记》"] },
  { q:"syx最喜欢看的二创形式是？",         o:["手书","文本","漫画","剪辑"] },
  { q:"syx最喜欢的制品形式是？",           o:["亚克力砖/流麻","纸片谷","亚克力立牌/挂件","色纸"] },
  { q:"syx偏好的结局类型是？",             o:["HE","BE","OE"] },
  { q:"syx看同人文偏好？",                 o:["原作向","平行au（如hp pa）","abo","经典文梗（如花吐症）"] }
];
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* ================= 口令门 ================= */
function tryGate(){
  const v = document.getElementById("gate-input").value.trim();
  if(v === GATE_CODE){
    document.getElementById("gate").style.display = "none";
    document.getElementById("main").style.display = "block";
    loadAll();
  }else{
    document.getElementById("gate-err").textContent = "口令不对哦～";
  }
}
document.getElementById("gate-btn").onclick = tryGate;
document.getElementById("gate-input").addEventListener("keydown", e=>{ if(e.key==="Enter") tryGate(); });

/* ================= 主逻辑 ================= */
async function loadAll(){
  try{
    const res = await fetch(supaUrl("/scores?select=name,score,device_id,detail,updated_at&order=updated_at.desc&limit=200"), { headers:supaHeaders() });
    if(!res.ok){ throw new Error("query failed"); }
    const rows = await res.json();
    if(!rows.length){
      document.getElementById("players").innerHTML = '<div class="empty">还没有人答题～</div>';
      renderSummary(0,0,0);
      renderQStats([]);
      return;
    }
    // detail 解析
    const parsed = rows.map(r=>{
      let detail = [];
      try{ detail = JSON.parse(r.detail || "[]") || []; }catch(e){}
      return { name:r.name, score:r.score, detail, time:r.updated_at };
    });
    renderSummary(parsed.length, parsed.reduce((s,r)=>s+r.score,0)/parsed.length, parsed.filter(r=>r.score===10).length);
    renderQStats(parsed);
    renderPlayers(parsed);
  }catch(e){
    document.getElementById("players").innerHTML = '<div class="load-err">加载失败：' + escapeHtml(e.message||e) + '（如果刚建了 detail 列，稍等一分钟再刷新试试）</div>';
  }
}

function renderSummary(total, avg, full){
  document.getElementById("summary").innerHTML = `
    <div class="sum-card sketch-card"><div class="sum-num">${total}</div><div class="sum-label">答题人数</div></div>
    <div class="sum-card sketch-card"><div class="sum-num">${total?avg.toFixed(1):"-"}<span style="font-size:13px;">题</span></div><div class="sum-label">平均答对</div></div>
    <div class="sum-card sketch-card"><div class="sum-num">${full}</div><div class="sum-label">全对人数</div></div>`;
}

function renderQStats(parsed){
  const box = document.getElementById("qstats");
  const stats = BANK.map((b,i)=>({ i, q:b.q, ok:0, total:0 }));
  parsed.forEach(r=>{
    const seen = {};
    r.detail.forEach(d=>{ seen[d.i] = d; });   // 同一次答题不会重复，保险处理
    Object.values(seen).forEach(d=>{
      if(stats[d.i]){ stats[d.i].total++; if(d.ok) stats[d.i].ok++; }
    });
  });
  const withData = stats.filter(s=>s.total>0).sort((a,b)=>(a.ok/a.total)-(b.ok/b.total));
  if(!withData.length){ box.innerHTML = '<div class="empty">暂无作答数据</div>'; return; }
  box.innerHTML = withData.map(s=>{
    const pct = Math.round(s.ok/s.total*100);
    return `<div class="qstat sketch-card">
      <div class="qstat-row"><span class="qstat-q">${s.i+1}. ${escapeHtml(s.q)}</span><span class="qstat-pct">${pct}%</span></div>
      <div class="bar-track"><div class="bar-fill" style="width:${pct}%"></div></div>
      <div style="font-size:11px;color:#999;margin-top:4px;">答对 ${s.ok}/${s.total} 人 · 正确答案：${escapeHtml(BANK[s.i].o[0])}</div>
    </div>`;
  }).join("");
}

function renderPlayers(parsed){
  const box = document.getElementById("players");
  box.innerHTML = parsed.map(r=>{
    const t = r.time ? new Date(r.time).toLocaleString("zh-CN",{month:"2-digit",day:"2-digit",hour:"2-digit",minute:"2-digit"}) : "";
    const list = r.detail.map(d=>{
      const q = BANK[d.i];
      if(!q) return "";
      const mark = d.ok ? '<span class="d-ok">✓</span>' : '<span class="d-bad">✗</span>';
      const sub = d.ok ? "" : `<div class="d-sub">正确答案：${escapeHtml(q.o[0])}</div>`;
      return `<div class="d-row">${mark}<div class="d-main">${escapeHtml(q.q)}<br>TA选了：<b>${escapeHtml(d.a||"?")}</b>${sub}</div></div>`;
    }).join("");
    return `<details class="player sketch-card">
      <summary>
        <span class="p-name">${escapeHtml(r.name||"路人")}</span>
        <span class="p-score">${r.score} 题</span>
        <span class="p-time">${t}</span>
        <span class="p-arrow">▶</span>
      </summary>
      <div class="detail-list">${list || '<div class="empty">该记录没有明细（可能是升级前的旧成绩）</div>'}</div>
    </details>`;
  }).join("");
}
</script>
</body>
</html>
